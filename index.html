<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Houdini Particles + Simple Hand Control</title>

<style>
html, body {
  margin: 0;
  overflow: hidden;
  background: #050505;
  font-family: Arial, sans-serif;
  color: #ff4fa0;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}

/* PANEL */
#panel {
  position: fixed;
  top: 10px;
  left: 10px;

  width: 320px;
  max-height: 92vh;
  overflow-y: auto;

  background: rgba(8, 0, 6, 0.34);
  backdrop-filter: blur(3px);

  padding: 14px;
  border-radius: 14px;
  border: 1px solid rgba(255, 79, 160, 0.28);

  font-size: 12px;
  z-index: 10;
}

#exportRow {
  width: 100%;
  margin: 0 0 10px 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

#exportRow button {
  margin: 0;
}

.controlsGrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px 10px;
}

.control {
  display: block;
  margin: 0;
  color: #ff8fc4;
}

.control span {
  display: block;
  margin-bottom: 4px;
  line-height: 1.1;
  white-space: nowrap;
}

input[type="range"] {
  width: 100%;
  accent-color: #ff4fa0;
}

button {
  width: 100%;
  padding: 9px;

  border: 1px solid #ff4fa0;
  border-radius: 10px;

  background: #050005;
  color: white;

  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #12000d;
  border-color: #ff79bb;
}

#video {
  position: fixed;
  right: 10px;
  bottom: 10px;
  width: 150px;
  border-radius: 12px;
  opacity: 0.25;
  transform: scaleX(-1);
  border: 1px solid rgba(255,79,160,0.35);
  z-index: 9;
}

/* MOBILE PANEL FROM BOTTOM */
@media (max-width: 768px) {
  #panel {
    top: auto;
    left: 0;
    bottom: 0;

    width: calc(100vw - 24px);
    max-height: 38vh;

    overflow-y: scroll;
    -webkit-overflow-scrolling: touch;

    border-radius: 18px 18px 0 0;

    background: rgba(5, 0, 5, 0.58);
    backdrop-filter: blur(1px);

    padding: 12px;
    font-size: 11px;
  }

  .controlsGrid {
    grid-template-columns: 1fr 1fr;
    gap: 8px 10px;
  }

  .control span {
    font-size: 11px;
  }

  input[type="range"] {
    height: 18px;
  }

  #video {
    width: 95px !important;
    right: 8px !important;
    bottom: 42vh !important;
  }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>
<canvas id="exportCanvas" style="display:none;"></canvas>
<video id="video" autoplay playsinline muted></video>

<div id="panel">

  <div id="exportRow">
    <button onclick="exportPNG()">Export PNG</button>
    <button id="exportMP4Btn" onclick="exportMP4()">Export MP4</button>
  </div>

  <div class="controlsGrid">

    <button onclick="randomize()">Randomize</button>
    <button onclick="startCamera()">Start Camera</button>

    <label class="control">
      <span>Hand Influence</span>
      <input id="handPower" type="range" min="0" max="4" step="0.01" value="1.4">
    </label>

    <label class="control">
      <span>Symmetry On / Off</span>
      <input id="symmetryOn" type="range" min="0" max="1" step="1" value="1">
    </label>

    <label class="control">
      <span>Symmetry Center</span>
      <input id="symmetryCenter" type="range" min="-300" max="500" step="1" value="0">
    </label>

    <label class="control">
      <span>Inner Orange Glow</span>
      <input id="innerGlow" type="range" min="0" max="1" step="0.01" value="0.38">
    </label>

    <label class="control">
      <span>Glow Size</span>
      <input id="glowSize" type="range" min="0" max="8" step="0.01" value="2.4">
    </label>

    <label class="control">
      <span>Scale</span>
      <input id="scale" type="range" min="0" max="4" step="0.01" value="0.85">
    </label>

    <label class="control">
      <span>Center X</span>
      <input id="center_x" type="range" min="-300" max="500" value="200">
    </label>

    <label class="control">
      <span>Center Y</span>
      <input id="center_y" type="range" min="-300" max="500" value="200">
    </label>

    <label class="control">
      <span>Cols</span>
      <input id="cols" type="range" min="60" max="420" value="150">
    </label>

    <label class="control">
      <span>Rows</span>
      <input id="rows" type="range" min="60" max="420" value="150">
    </label>

    <label class="control">
      <span>Speed</span>
      <input id="speed" type="range" min="0" max="4" step="0.01" value="1">
    </label>

    <label class="control">
      <span>Point Size</span>
      <input id="pscale" type="range" min="0.2" max="3" step="0.01" value="0.8">
    </label>

    <label class="control">
      <span>X Min</span>
      <input id="x_min" type="range" min="-400" max="400" value="0">
    </label>

    <label class="control">
      <span>X Max</span>
      <input id="x_max" type="range" min="0" max="800" value="400">
    </label>

    <label class="control">
      <span>Y Min</span>
      <input id="y_min" type="range" min="-400" max="400" value="0">
    </label>

    <label class="control">
      <span>Y Max</span>
      <input id="y_max" type="range" min="0" max="800" value="400">
    </label>

    <label class="control">
      <span>K Divide</span>
      <input id="k_div" type="range" min="2" max="40" step="0.1" value="8">
    </label>

    <label class="control">
      <span>K Subtract</span>
      <input id="k_sub" type="range" min="-30" max="30" step="0.1" value="13">
    </label>

    <label class="control">
      <span>Y Wave Divide</span>
      <input id="e_ydiv" type="range" min="4" max="80" step="0.1" value="24">
    </label>

    <label class="control">
      <span>Q Add</span>
      <input id="q_add" type="range" min="0" max="200" step="0.1" value="90">
    </label>

    <label class="control">
      <span>Wave Power</span>
      <input id="q_dk" type="range" min="-6" max="6" step="0.01" value="1">
    </label>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const exportCanvas = document.getElementById("exportCanvas");
const exportCtx = exportCanvas.getContext("2d");
const video = document.getElementById("video");

let handsData = [];
let handX = 0.5;
let handY = 0.5;
let fingerSpread = 0.0;
let handActive = false;

let handScaleBoost = 1.0;
let leftControl = 0.5;
let rightControl = 0.5;

function resize() {
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;

  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );
}

window.addEventListener("resize", resize);
resize();

function val(id) {
  return parseFloat(document.getElementById(id).value);
}

function setVal(id, value) {
  const el = document.getElementById(id);
  el.value = Math.max(
    parseFloat(el.min),
    Math.min(parseFloat(el.max), value)
  );
}

function drawToExportCanvas() {
  const exportW = 1080;
  const exportH = 1920;

  exportCanvas.width = exportW;
  exportCanvas.height = exportH;

  exportCtx.fillStyle = "#050505";
  exportCtx.fillRect(0, 0, exportW, exportH);

  const sourceW = canvas.width;
  const sourceH = canvas.height;

  const coverScale = Math.max(exportW / sourceW, exportH / sourceH);
  const drawW = sourceW * coverScale;
  const drawH = sourceH * coverScale;
  const dx = (exportW - drawW) * 0.5;
  const dy = (exportH - drawH) * 0.5;

  exportCtx.drawImage(canvas, dx, dy, drawW, drawH);
}

function exportPNG() {
  drawToExportCanvas();

  const link = document.createElement("a");
  link.download = "houdini_mobile_hand_particles_9x16.png";
  link.href = exportCanvas.toDataURL("image/png");
  link.click();
}

function exportMP4() {
  const btn = document.getElementById("exportMP4Btn");

  if (!exportCanvas.captureStream) {
    alert("Video export is not supported in this browser. Try Chrome or Edge.");
    return;
  }

  let mimeType = "";

  if (MediaRecorder.isTypeSupported("video/mp4;codecs=h264")) {
    mimeType = "video/mp4;codecs=h264";
  } else if (MediaRecorder.isTypeSupported("video/mp4")) {
    mimeType = "video/mp4";
  } else if (MediaRecorder.isTypeSupported("video/webm;codecs=vp9")) {
    mimeType = "video/webm;codecs=vp9";
  } else if (MediaRecorder.isTypeSupported("video/webm")) {
    mimeType = "video/webm";
  } else {
    alert("Video export is not supported in this browser.");
    return;
  }

  const isMP4 = mimeType.includes("mp4");
  const extension = isMP4 ? "mp4" : "webm";

  exportCanvas.width = 1080;
  exportCanvas.height = 1920;

  const stream = exportCanvas.captureStream(30);
  const chunks = [];

  let recorder;

  try {
    recorder = new MediaRecorder(stream, {
      mimeType: mimeType,
      videoBitsPerSecond: 9000000
    });
  } catch (err) {
    alert("Could not start video recorder: " + err.message);
    return;
  }

  let recording = true;

  function drawExportFrame() {
    if (!recording) return;

    drawToExportCanvas();
    requestAnimationFrame(drawExportFrame);
  }

  recorder.ondataavailable = event => {
    if (event.data && event.data.size > 0) {
      chunks.push(event.data);
    }
  };

  recorder.onstop = () => {
    recording = false;

    const blob = new Blob(chunks, { type: mimeType });
    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.download = "houdini_mobile_hand_particles_9x16_15sec." + extension;
    link.href = url;
    link.click();

    setTimeout(() => URL.revokeObjectURL(url), 1000);

    btn.textContent = "Export MP4";
    btn.disabled = false;
    btn.style.opacity = "1";
  };

  btn.disabled = true;
  btn.style.opacity = "0.65";

  let secondsLeft = 15;
  btn.textContent = "Recording 15s";

  const timer = setInterval(() => {
    secondsLeft--;
    btn.textContent = "Recording " + secondsLeft + "s";
    if (secondsLeft <= 0) {
      clearInterval(timer);
    }
  }, 1000);

  drawExportFrame();
  recorder.start();

  setTimeout(() => {
    if (recorder && recorder.state === "recording") {
      recorder.stop();
    }
  }, 15000);
}

function randomize() {
  setVal("k_div", 5 + Math.random() * 22);
  setVal("k_sub", 6 + Math.random() * 18);
  setVal("e_ydiv", 12 + Math.random() * 45);
  setVal("q_add", 40 + Math.random() * 120);
  setVal("q_dk", -2 + Math.random() * 4);
  setVal("speed", 0.4 + Math.random() * 2.2);
}

function dist(a, b) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}

async function startCamera() {
  const hands = new Hands({
    locateFile: file =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });

  hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 0,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.6
  });

  hands.onResults(results => {
    handsData = [];

    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      handActive = true;

      for (let h = 0; h < results.multiHandLandmarks.length; h++) {
        const lm = results.multiHandLandmarks[h];
        const wrist = lm[0];
        const thumb = lm[4];
        const index = lm[8];
        const middle = lm[12];
        const ring = lm[16];
        const pinky = lm[20];

        // mirrored screen coordinates, so left/right feels natural to the viewer
        const screenX = 1.0 - wrist.x;
        const screenY = wrist.y;

        // open / close finger value, averaged from fingertip distances
        const openClose = (
          dist(thumb, index) +
          dist(thumb, middle) +
          dist(thumb, ring) +
          dist(thumb, pinky)
        ) / 4.0;

        handsData.push({
          lm,
          x: screenX,
          y: screenY,
          openClose
        });
      }

      handsData.sort((a, b) => a.x - b.x);

      const power = Math.max(0.0, Math.min(1.0, val("handPower") / 4.0));
      const smooth = 0.16 * power;

      if (handsData.length === 1) {
        const hand = handsData[0];

        // ONE HAND:
        // left / right -> X Max only
        // up / down -> Y Max only
        // open / close fingers -> Q Add only
        const targetXMax = 80 + hand.x * 720;
        const targetYMax = 80 + (1.0 - hand.y) * 720;
        const targetQAdd = Math.max(0, Math.min(200, hand.openClose * 900));

        setVal("x_max", val("x_max") + (targetXMax - val("x_max")) * smooth);
        setVal("y_max", val("y_max") + (targetYMax - val("y_max")) * smooth);
        setVal("q_add", val("q_add") + (targetQAdd - val("q_add")) * smooth);

      } else if (handsData.length >= 2) {
        const leftHand = handsData[0];
        const rightHand = handsData[handsData.length - 1];

        // TWO HANDS:
        // left hand left / right -> X Max only
        // right hand up / down -> Y Max only
        // distance between both hands -> Q Add only
        const handDistance = dist(leftHand, rightHand);

        const targetXMax = 80 + leftHand.x * 720;
        const targetYMax = 80 + (1.0 - rightHand.y) * 720;
        const targetQAdd = Math.max(0, Math.min(200, handDistance * 220));

        setVal("x_max", val("x_max") + (targetXMax - val("x_max")) * smooth);
        setVal("y_max", val("y_max") + (targetYMax - val("y_max")) * smooth);
        setVal("q_add", val("q_add") + (targetQAdd - val("q_add")) * smooth);
      }

    } else {
      handActive = false;
    }
  });

  const camera = new Camera(video, {
    onFrame: async () => {
      await hands.send({ image: video });
    },
    width: 640,
    height: 480
  });

  camera.start();
}

function drawFingerCircles() {
  const w = window.innerWidth;
  const h = window.innerHeight;

  ctx.save();

  for (let hand of handsData) {
    const tips = [4, 8, 12, 16, 20];

    for (let id of tips) {
      const p = hand.lm[id];

      const x = (1.0 - p.x) * w;
      const y = p.y * h;

      ctx.beginPath();
      ctx.arc(x, y, 9, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,79,160,0.82)";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(x, y, 14, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255,255,255,0.55)";
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  ctx.restore();
}

function draw(time) {
  const w = window.innerWidth;
  const h = window.innerHeight;

  ctx.fillStyle = "rgba(5,5,5,0.22)";
  ctx.fillRect(0, 0, w, h);

  const cols = Math.floor(val("cols"));
  const rows = Math.floor(val("rows"));

  const speed = val("speed");
  const scale = val("scale");
  const pscale = val("pscale");
  const handPower = val("handPower");
  const symmetryOn = val("symmetryOn");
  const symmetryCenter = val("symmetryCenter");
  const innerGlow = val("innerGlow");
  const glowSize = val("glowSize");

  const x_min = val("x_min");
  const x_max = val("x_max");
  const y_min = val("y_min");
  const y_max = val("y_max");

  const k_div = val("k_div");
  const k_sub = val("k_sub");
  const e_ydiv = val("e_ydiv");
  const q_add = val("q_add");
  const q_dk = val("q_dk");

  const center_x = val("center_x");
  const center_y = val("center_y");

  const t = time * 0.001 * speed;

  ctx.fillStyle = "rgba(255,255,255,0.92)";


  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {

      let u = i / Math.max(1, cols - 1);
      let v = j / Math.max(1, rows - 1);

      // optional symmetry; when enabled it makes a mirrored pair from the same formula
      let mirrorSide = i < cols * 0.5 ? -1.0 : 1.0;
      if (symmetryOn === 1) {
        u = Math.abs(u - 0.5) * 2.0;
      }

      let x = x_min + u * (x_max - x_min);
      let y = y_min + v * (y_max - y_min);


      let k = x / k_div - k_sub;

      let e =
        Math.cos(k) +
        Math.sin(y / e_ydiv) +
        Math.cos(k / 2.0);

      let d = Math.abs(e);

      let q =
        x / 4.0 +
        q_add +
        d * k * q_dk *
        (1.0 + Math.cos(3.0 * d - 2.0 * t + y / 29.0));

      let c =
        (y * e) / 99.0 -
        t / 18.0 +
        d / 7.0;


      let X = q * Math.cos(c);

      // movable symmetry axis
      if (symmetryOn === 1) {
        X = symmetryCenter + mirrorSide * Math.abs(X - symmetryCenter);
      }

      let Y =
        (q / 2.0 + 30.0 * Math.cos(c / 3.0)) *
        Math.sin(c) +
        80.0 * e;

      let sx =
        w / 2 +
        (X - center_x) * scale;

      let sy =
        h / 2 +
        (Y - center_y) * scale;

      if (innerGlow > 0) {
        const centerDx = (X - symmetryCenter) / Math.max(1.0, x_max - x_min);
        const centerDy = (Y - center_y) / Math.max(1.0, y_max - y_min);
        const innerMask = Math.max(0.0, 1.0 - Math.sqrt(centerDx * centerDx + centerDy * centerDy) * 1.7);
        const pulse = 0.55 + 0.45 * Math.sin(t * 2.0 + e * 2.5 + i * 0.03);
        const glowAlpha = innerGlow * innerMask * pulse * 0.55;

        if (glowAlpha > 0.01) {
          ctx.fillStyle = `rgba(255,165,32,${glowAlpha})`;
          ctx.beginPath();
          ctx.arc(sx, sy, pscale + glowSize * innerMask, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,0.92)";
        }
      }

      ctx.beginPath();
      ctx.arc(sx, sy, pscale, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  drawFingerCircles();

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>

</body>
</html>
